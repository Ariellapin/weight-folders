[package]
name = "weight-folders"
version = "0.1.0"
edition = "2021"
description = "Scan a drive or folder and visualize folder/file sizes as a treemap"
authors = ["Ariel Lapinin"]
license = "MIT"
repository = "https://github.com/Ariellapin/weight-folders"

[dependencies]
eframe = "0.36"
egui = "0.36"
rfd = "0.17"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
zstd = "0.13"
directories = "6"
trash = "5"
open = "5"
humansize = "2"
chrono = "0.4"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
